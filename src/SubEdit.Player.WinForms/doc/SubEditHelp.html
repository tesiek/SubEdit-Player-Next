a href=\"#temat-179\">klatki końcowej\u003c/a> napisu.\u003c/p>"},{"id":"temat-111","title":"Zastosuj przy badaniu opóźnienia napisów względem filmu","content":"\u003cp>\u003ca href=\"#temat-109\">Szybkość reakcji\u003c/a> będzie brana pod uwagę także przy badaniu \u003ca href=\"#temat-078\">opóźnienia napisów względem filmu\u003c/a>\u003c/p>"},{"id":"temat-112","title":"Przy wstawianiu klatki początkowej zachowaj poprzednią różnicę klatki końcowej i początkowej","content":"\u003cp>Jeżeli w aktualnej linii istnieje już wpis o \u003ca href=\"#temat-178\">klatce początkowej\u003c/a>&nbsp;i&nbsp;\u003ca href=\"#temat-179\">końcowej\u003c/a> to po wstawieniu nowej klatki początkowej funkcją&nbsp;\u003ca href=\"#temat-066\">Wstaw klatkę początkową\u003c/a>&nbsp;(klawisz \u003ccode>Insert\u003c/code>) zostanie zachowana poprzednia różnica klatki końcowej do początkowej. Czyli pozostanie poprzednia długość wyświetlania napisu.\u003c/p>"},{"id":"temat-113","title":"Po wstawieniu klatki początkowej napisu przenieś kursor do następnego wiersza","content":"\u003cp>Opcja powoduje przeniesienie kursora do następnego wiersza po wstawieniu \u003ca href=\"#temat-178\">klatki początkowej\u003c/a> lub końcowej.\u003c/p>\n\u003cp>Jeżeli klatka początkowa bądź końcowa jest wstawiana w miejscu, w którym nie ma żadnego tekstu kursor nie będzie przeniesiony do następnej linii.\u003c/p>"},{"id":"temat-114","title":"Domyślny czas wyświetlania napisu","content":"\u003cp>Określa czas pokazywania napisu, którego czas wyświetlania nie jest określony jawnie.\u003c/p>\n\u003cp>Wartości te są też wykorzystywane przez inne opcje programu, które potrzebują wyliczenia długości wyświetlania napisu.\u003c/p>"},{"id":"temat-123","title":"Dostosuj szerokość wierszy napisów, jeżeli wychodzą poza ekran","content":"\u003cp>Jeżeli przy danej wielkości czcionki któryś wiersz napisów wychodzi poza ekran, jego wyrazy początkowe przenoszone są o jeden wiersz wyżej, aż do chwili, kiedy napis będzie się mieścił na ekranie.\u003c/p>"},{"id":"temat-125","title":"Interpretuj w napisach kody kontrolne mDVDp (np. {y:i}{c:$FA0530})","content":"\u003cp>Pozwala sterować parametrami czcionki napisów z poziomu tekstu napisu.\u003c/p>\n\u003ch3>Dostępne kody kontrolne:\u003c/h3>\n\u003cp>\u003cstrong>\u003ccode>{c:$bbggrr}\u003c/code>\u003c/strong> - kolor napisu dla wiersza (rr, gg, bb to składowe RGB koloru napisu)\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{C:$bbggrr}\u003c/code>\u003c/strong> - kolor napisu dla całej linii\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{b:$bbggrr}\u003c/code>\u003c/strong> - kolor tła napisu dla wiersza (rr, gg, bb to składowe RGB koloru napisu)\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{B:$bbggrr}\u003c/code>\u003c/strong> - kolor tła napisu dla całej linii\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{f:fontname}\u003c/code>\u003c/strong> - czcionka dla wiersza\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{F:fontname}\u003c/code>\u003c/strong> - czcionka dla całej linii\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{s:size}\u003c/code>\u003c/strong> - rozmiar czcionki dla wiersza\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{S:size}\u003c/code>\u003c/strong> - rozmiar czcionki dla całej linii\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{y:style}\u003c/code>\u003c/strong> - format czcionki dla wiersza\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>{Y:style}\u003c/code>\u003c/strong> - format czcionki dla całej linii\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>style\u003c/code>\u003c/strong> - \u003cstrong>bold\u003c/strong>, \u003cstrong>italic\u003c/strong>, \u003cstrong>underline\u003c/strong> (separator: \u003ccode>+\u003c/code>), np. \u003ccode>{y:bold+italic}\u003c/code>\u003cbr>\u003cstrong>b\u003c/strong>, \u003cstrong>i\u003c/strong>, \u003cstrong>u\u003c/strong> (separator: \u003ccode>,\u003c/code>), np. \u003ccode>{y:b,i}\u003c/code>\u003c/p>\n\u003ch3>Przykład:\u003c/h3>\n\u003cp>\u003ccode>{1000}{1100}{C:$FF0050}{y:b}Tutaj tekst.|{s:25}{f:Courier}A tutaj druga linia.\u003c/code>\u003c/p>"},{"id":"temat-133","title":"Podczas odtwarzania ostrzegaj o nieposortowanych napisach","content":"\u003cp>Po włączeniu tej opcji program podczas odtwarzania ostrzega o napisie, którego czas rozpoczęcia jest wcześniejszy niż czas rozpoczęcia poprzedniego napisu.\u003c/p>\n\u003cp>Napisy rozpoczynające się dokładnie w tym samym czasie nie wywołują ostrzeżenia.\u003c/p>\n\u003cp>Okno ostrzeżenia podaje numer problematycznej linii i zamyka się automatycznie po pięciu sekundach, jeżeli użytkownik nie zamknie go wcześniej.\u003c/p>\n\u003cp>Jeżeli film był odtwarzany, na czas wyświetlania ostrzeżenia zostaje wstrzymany, a po zamknięciu okna odtwarzanie jest automatycznie wznawiane.\u003c/p>\n\u003cp>Ten sam wpis nie jest ponownie zgłaszany podczas dalszego odtwarzania. Po cofnięciu filmu ostrzeżenie może pojawić się ponownie.\u003c/p>"},{"id":"temat-124","title":"Wyświetlaj w kursywie wiersze zaczynające się od: /, *, #","content":"\u003cp>Funkcja pozwala wybrać sposób identyfikacji wiersza (logicznego, czyli rozdzielony \"|\"), który będzie wyświetlany w kursywie.\u003c/p>\u003cp>Dostępne znaki rozpoznawcze kursywy zostaną usunięte podczas zamiany formatowania wiersza.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>Np. napis:\u003c/p>\u003cp>{11}{22}/kursywa/|wiersz2 zostanie wyświetlony jako:\u003c/p>\n\u003cp>\u003ci>kursywa\u003c/i>\u003cbr>wiersz2\u003c/p>\u003cp>albo napis\u003c/p>\u003cp>{11}{22}*kursywa*|wiersz2&nbsp;\u003c/p>\u003cp>również zostanie wyświetlony jako:\u003c/p>\n\u003cp>\u003ci>kursywa\u003c/i>\u003cbr>wiersz2\u003c/p>\u003cp>\u003cbr>\u003c/p>"},{"id":"temat-127","title":"Minimalny odstęp między wyświetlanymi napisami (w klatkach)","content":"\u003cp>Określa minimalną ilość klatek, które będą stanowiły odstęp, między schowaniem aktualnego napisu, a wyświetleniem następnego.\u003c/p>\n\u003cp>Ten parametr jest również wykorzystywany przy opcjach\u003c/p>\n\u003cp>\u003ca href=\"#temat-054\">Zmień czas wyświetlania napisów\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"#temat-063\">Popraw napisy\u003c/a>\u003c/p>"},{"id":"temat-132","title":"Czcionka napisów","content":"\u003cp>Określa czcionkę używaną do wyświetlania napisów tekstowych.\u003c/p>\n\u003cp>SubEdit-Player Next używa wspólnego ustawienia czcionki w trybie okienkowym i pełnoekranowym — nie ma oddzielnych czcionek dla obu trybów.\u003c/p>\n\u003cp>Wygląd wybranej czcionki jest prezentowany w podglądzie w oknie opcji.\u003c/p>\n\u003cp>Napisy tekstowe są renderowane w niezależnej warstwie. Przesunięcie i powiększenie obrazu filmu nie przesuwa ani nie skaluje czcionki napisów.\u003c/p>\n\u003cp>\u003cstrong>Zobacz także:\u003c/strong> \u003ca href=\"#temat-131\">Rozmiar czcionki napisów\u003c/a>\u003c/p>"},{"id":"temat-131","title":"Rozmiar czcionki napisów","content":"\u003cp>Określa sposób sterowania rozmiarem czcionki napisów tekstowych.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>Stała wielkość\u003c/code>\u003c/strong>\u003c/p>\n\u003cp>Rozmiar czcionki pozostaje stały niezależnie od wielkości okna programu i rozdzielczości ekranu.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>Zależny od wielkości okna\u003c/code>\u003c/strong>\u003c/p>\n\u003cp>Rozmiar czcionki jest skalowany wraz z wysokością obszaru odtwarzacza. W trybie pełnoekranowym skaluje się odpowiednio do wysokości ekranu.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>Minimalny rozmiar czcionki\u003c/code>\u003c/strong>\u003c/p>\n\u003cp>Określa dolną granicę rozmiaru czcionki w trybie zależnym od wielkości okna. Ustawienie jest aktywne tylko w tym trybie.\u003c/p>"},{"id":"temat-134","title":"Kolor czcionki i tła napisów","content":"\u003cp>Pozwala zmienić kolor czcionki i tła napisów.\u003c/p>\n\u003cp>Ustawienie działa zarówno dla trybu okienkowego jak i pełnoekranowego oraz dla czcionek przezroczystych i nieprzezroczystych.\u003c/p>"},{"id":"temat-196","title":"Przezroczystość tła napisu i kolor obrysu","content":"\u003cp>Pozwala zmienić przezroczystość tła napisu w zakresie 0-100%\u003c/p>\u003cp>0% = napisy na zupełnie przezroczystym tle\u003c/p>\u003cp>100% = napisy na nieprzezroczystym tle w wybranym \u003ca href=\"#temat-134\">kolorze\u003c/a>.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>Kolor obrysu pozwala ustawić inny kolor obrysu czcionki niż sam kolor czcionki napisu. Można również ustalić grubość wybranego koloru obrysu czcionki.\u003c/p>\u003cp>Np. jeśli wyświetlamy białą czcionkę to warto ustawić czarny obrys bo białe litery mogą być niewidoczne na jasnych scenach filmu.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},{"id":"temat-136","title":"Pozycja napisów","content":"\u003cp>Umożliwia określenie miejsca wyświetlania napisów tekstowych oraz ich marginesów.\u003c/p>\n\u003cp>Ustawienia znajdują się w oknie \u003cstrong>Opcje programu\u003c/strong> (\u003ccode>F12\u003c/code>) w sekcji wyglądu napisów.\u003c/p>\n\u003cp>Dostępne są:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Wyrównanie napisów\u003c/strong> — wybór jednej z 9 pozycji bazowych (góra / środek / dół oraz lewo / środek / prawo),\u003c/li>\n\u003cli>\u003cstrong>Marginesy\u003c/strong> — wartości w pikselach określające odstęp od krawędzi obszaru bazowego,\u003c/li>\n\u003cli>\u003cstrong>Pozycja napisów względem klatki obrazu\u003c/strong> — wybór, czy napisy mają być pozycjonowane względem właściwego prostokąta obrazu filmu, czy względem całego okna odtwarzacza lub ekranu w trybie pełnoekranowym.\u003c/li>\n\u003c/ul>\n\u003cp>Po odznaczeniu opcji pozycjonowania względem klatki obrazu napisy mogą być umieszczane również poza właściwym prostokątem filmu, np. na czarnym pasie pod obrazem panoramicznym.\u003c/p>\n\u003cp>Tekstowe napisy są renderowane w niezależnej warstwie i nie są skalowane ani przesuwane przez funkcje Pan i Zoom obrazu wideo.\u003c/p>"},{"id":"temat-151","title":"Przewinięcie użytkownika w lewo/prawo","content":"\u003cp>Definiuje liczbę sekund przewinięcia filmu niezależnie w lewo i w prawo.\u003c/p>\n\u003cp class=\"shortcut-line\">\u003cstrong>Skróty:\u003c/strong> \u003ccode>Alt+Left\u003c/code> — przewinięcie w lewo; \u003ccode>Alt+Right\u003c/code> — przewinięcie w prawo.\u003c/p>\n\u003cp>Jest to przewinięcie, którego skróty działają tak samo w trybie z edytorem i bez edytora.\u003c/p>"},{"id":"temat-167","title":"Wstrzymaj film, gdy okno aplikacji jest zminimalizowane","content":"\u003cp>Funkcja włącza pauzę (wstrzymuje odtwarzanie filmu), gdy aplikacja jest zminimalizowana.\u003c/p>\n\u003cp>Po przywróceniu okna aplikacji odtwarzanie filmu zostaje automatycznie przywrócone.\u003c/p>"},{"id":"temat-168","title":"Wstrzymaj film, gdy wyświetlane okno dialogowe","content":"\u003cp>Funkcja włącza pauzę (wstrzymuje odtwarzanie filmu), gdy wyświetlane jest jakieś okno dialogowe.\u003c/p>\n\u003cp>Po zamknięciu okna odtwarzanie filmu zostaje automatycznie przywrócone.\u003c/p>"},{"id":"temat-169","title":"Wstrzymaj film, gdy okno aplikacji nie jest aktywne","content":"\u003cp>Funkcja włącza pauzę (wstrzymuje odtwarzanie filmu), gdy okno aplikacji SubEdit przestaje być oknem aktywnym, a włącza odtwarzanie filmu w momencie, gdy okno stanie się ponownie aktywne.\u003c/p>"},{"id":"temat-202","title":"Po zakończeniu odtwarzania wyjdź z trybu pełnoekranowego","content":"\u003cp>Po włączeniu tej opcji program po naturalnym zakończeniu odtwarzania przywraca tryb okienkowy, jeżeli film był wyświetlany na pełnym ekranie.\u003c/p>\n\u003cp>Podczas odtwarzania kolejnych filmów z katalogu lub kolejnych części wieloczęściowego filmu tryb pełnoekranowy jest zachowywany pomiędzy plikami. Powrót do trybu okienkowego następuje dopiero po zakończeniu ostatniego filmu w danej sekwencji.\u003c/p>"},{"id":"temat-160","title":"Pozycja tekstu informacyjnego OSD","content":"\u003cp>Określa pozycję tekstu informacyjnego OSD albo całkowicie wyłącza jego wyświetlanie.\u003c/p>\n\u003cp>Dostępne ustawienia:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Prawy górny róg okna\u003c/code>,\u003c/li>\n\u003cli>\u003ccode>Nie wyświetlaj\u003c/code>.\u003c/li>\n\u003c/ul>"},{"id":"temat-147","title":"Wyświetlaj OSD również w trybie okienkowym","content":"\u003cp>Włącza wyświetlanie komunikatów OSD również w trybie okienkowym.\u003c/p>\n\u003cp>Po wyłączeniu tej opcji komunikaty OSD są wyświetlane tylko w trybie pełnoekranowym. Jeżeli pozycja OSD jest ustawiona na \u003ccode>Nie wyświetlaj\u003c/code>, komunikaty pozostają ukryte niezależnie od trybu pracy.\u003c/p>"},{"id":"temat-161","title":"Wielkość czcionki OSD","content":"\u003cp>Określa wielkość czcionki używanej do wyświetlania informacji OSD.\u003c/p>\n\u003cp>Ustawienie jest wspólne dla trybu okienkowego i pełnoekranowego.\u003c/p>"},{"id":"temat-162","title":"Czas wyświetlania OSD na ekranie","content":"\u003cp>Określa, przez jaki czas komunikaty OSD pozostają widoczne na ekranie.\u003c/p>\n\u003cp>Wartość podawana jest w sekundach i może być ułamkowa, np. \u003ccode>1,5 s\u003c/code>.\u003c/p>"},{"id":"temat-197","title":"Kolory i tło OSD","content":"\u003cp>Pozwala ustawić wygląd komunikatów OSD w trybie okienkowym i pełnoekranowym.\u003c/p>\n\u003cp>Dostępne ustawienia obejmują:\u003c/p>\n\u003cul>\n\u003cli>kolor tekstu OSD,\u003c/li>\n\u003cli>kolor tła,\u003c/li>\n\u003cli>przezroczystość tła w zakresie 0–100%,\u003c/li>\n\u003cli>kolor obramowania,\u003c/li>\n\u003cli>grubość obramowania w zakresie 0–5 px.\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>0%\u003c/code> oznacza całkowicie przezroczyste tło, a \u003ccode>100%\u003c/code> — tło całkowicie nieprzezroczyste.\u003c/p>\n\u003cp>Zmiany można ocenić na bieżąco w podglądzie dostępnym w oknie opcji.\u003c/p>"},{"id":"temat-198","title":"Dekodowanie filmu","content":"\u003cp>Pozwala ustawić sposób dekodowania filmu.\u003c/p>\u003cp>Automatyczne - zalecany wybór\u003c/p>\u003cp>Sprzętowe (HW) - dekodowanie wideo obciąża kartę graficzną\u003c/p>\u003cp>Programowe (SW) - dekodowanie wideo obciąża procesor\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>Na dolnym pasku statusu oraz na pasku statusu na pełnym ekranie jest informacja&nbsp;\u003cstrong>\u003ccode>[H/W]\u003c/code>\u003c/strong>&nbsp;lub&nbsp;\u003cstrong>\u003ccode>[S/W]\u003c/code>\u003c/strong>&nbsp;pokazująca który tryb jest aktualnie wykorzystywany.\u003c/p>\u003cp>\u003cbr>\u003c/p>"}]},{"id":"cat-09","title":"Pojęcia i formaty","topics":[{"id":"temat-178","title":"Klatka początkowa","content":"\u003cp>Klatka początkowa (startowa)\u003c/p>\n\u003cp>Klatka napisu, która określa klatkę filmu, w której napis ma zostać wyświetlony.\u003c/p>\u003cp>{klatka_startowa}{klatka_końcowa}napis|wiersz 2\u003c/p>\n\u003cp>Pojęcie to dotyczy też czasu pokazania napisów w formacie MPL2\u003c/p>\u003cp>[czas_startowy][czas_końcowy]napis|wiersz 2\u003c/p>"},{"id":"temat-179","title":"Klatka końcowa","content":"\u003cp>Klatka napisu, która określa klatkę filmu, w której napis ma być ukryty.\u003c/p>\u003cp>{klatka_pokazania}{klatka_schowania}napis|wiersz 2\u003c/p>\n\u003cp>Pojęcie to dotyczy też czasu schowania napisów w formacie MPL2\u003c/p>\u003cp>[czas_pokazania][czas_schowania]napis|wiersz 2\u003c/p>"},{"id":"temat-180","title":"FPS","content":"\u003cp>Ang. Frames Per Second, czyli ilość klatek na sekundę odtwarzania filmu.\u003c/p>"},{"id":"temat-183","title":"Format czasowy TMPlayer","content":"\u003cp>Oznacza, format zapisu napisów do filmu, w którym moment wyświetlenia napisu przedstawiony jest w postaci godziny, minuty i sekundy filmu, podczas której napis ma zostać wyświetlony.\u003c/p>\n\u003ch3>Najpopularniejsze formaty zapisu czasowego:\u003c/h3>\n\u003cp>0:00:00:napis\u003c/p>\n\u003cp>00:00:00:napis\u003c/p>\n\u003cp>00:00:00 napis\u003c/p>\n\u003cp>0:00:00=napis\u003c/p>\n\u003ch3>Przykład:\u003c/h3>\n\u003cp>00:00:26:Komandosi mogą być|dumni ze swojej tradycji.\u003c/p>\n\u003cp>00:00:29:Od XVIII wieku, stajemy|na pierwszej linii ognia na wszystkich...\u003c/p>\n\u003cp>00:00:33:w których biorą udział Stany Zjednoczone.\u003c/p>\n\u003cp>00:00:36:To właśnie Wy jesteście|dziedzicami tej spuścizny,\u003c/p>\n\u003cp>00:00:40:dlatego żal mi się z Wami żegnać.|Oddanie służyliście swojej ojczyźnie,\u003c/p>"},{"id":"temat-184","title":"Format czasowy MPL2","content":"\u003cp>Oznacza format zapisu napisów do filmu, w którym moment wyświetlenia \nnapisu przedstawia liczba określająca czas w dziesiątych częściach \nsekundy od początku filmu.\u003c/p>\n\u003cp>Format zawiera też informację na temat ukrycia napisu.\u003c/p>\n\u003cp>[czas_pokazania][czas_schowania]napis|wiersz 2\u003c/p>\n\u003cp>MPL2 jest formatem wywodzącym się z formatu MPL. Została zmieniona \njedynie forma zapisu na zbliżoną do formatu klatkowego (w celu \nułatwienia dostosowania do tego formatu programom obsługującym format \nklatkowy).\u003c/p>\n\u003ch3>Notka:\u003c/h3>\u003cp>Format MPL2 posiada zalety formatu klatkowego i czasowego przy czym pozbawiony jest też ich wad.\u003c/p>\n\u003cp>Napisy pasują do filmów z różnym współczynnikiem FPS filmu (również \njest to zaletą formatu czasowego, ale wadą formatu klatkowego).\u003c/p>\n\u003cp>Można dokładnie odwzorować czas pokazania i schowania napisu (jest to\n zaletą w formacie klatkowym, ale wadą w zwykłym formacie czasowym).\u003c/p>\n\u003ch3>Przykład:\u003c/h3>\n\u003cp>[260][291]Komandosi mogą być|dumni ze swojej tradycji.\u003c/p>\n\u003cp>[292][333]Od XVIII wieku, stajemy|na pierwszej linii ognia na wszystkich...\u003c/p>\n\u003cp>[333][364]w których biorą udział Stany Zjednoczone.\u003c/p>\n\u003cp>[365][406]To właśnie Wy jesteście|dziedzicami tej spuścizny,\u003c/p>\n\u003cp>[406][448]dlatego żal mi się z Wami żegnać.|Oddanie służyliście swojej ojczyźnie,\u003c/p>"},{"id":"temat-185","title":"Format klatkowy mDVD","content":"\u003cp>Oznacza format zapisu napisów do filmu, w którym moment wyświetlenia \nnapisu przedstawia klatka filmu, podczas której napis ma zostać \nwyświetlony&nbsp;\u003c/p>\u003cp>{klatka startowa}\u003c/p>\n\u003cp>Format zawiera też informację na temat ukrycia napisu {klatka końcowa}\u003c/p>\n\u003ch3>Format zapisu klatkowego:\u003c/h3>\n\u003cp>{klatka_pokazania}{klatka_schowania}napis|wiersz 2\u003c/p>\n\u003ch3>Przykład:\u003c/h3>\n\u003cp>{625}{699}Komandosi mogą być|dumni ze swojej tradycji.\u003c/p>\n\u003cp>{700}{799}Od XVIII wieku, stajemy|na pierwszej linii ognia na wszystkich...\u003c/p>\n\u003cp>{800}{874}w których biorą udział Stany Zjednoczone.\u003c/p>\n\u003cp>{875}{974}To właśnie Wy jesteście|dziedzicami tej spuścizny,\u003c/p>\n\u003cp>{975}{1074}dlatego żal mi się z Wami żegnać.|Oddanie służyliście swojej ojczyźnie,\u003c/p>"},{"id":"temat-187","title":"Format SRT (SubRip)","content":"\u003cp>SRT to format używany m.in. przez ripper napisów z płyt DVD.\u003c/p>\n\u003cp>SubEdit obsługuje ten format napisów.\u003c/p>\n\u003ch3>UKŁAD:\u003c/h3>\u003cdiv>\u003cpre id=\"mwDQ\" data-mw=\"{&quot;name&quot;:&quot;pre&quot;,&quot;attrs&quot;:{},&quot;body&quot;:{&quot;extsrc&quot;:&quot;\\n Numer napisu\\n Początek wyświetlania --&gt; Koniec wyświetlania\\n Tekst napisu (jedna lub więcej linii)\\n Przerwa\\n&quot;}}\"> Numer napisu\n Początek wyświetlania --&gt; Koniec wyświetlania\n Tekst napisu (jedna lub więcej linii)\n Przerwa\u003c/pre>\u003c/div>\u003ch3>PRZYKŁAD:\u003c/h3>\u003cpre id=\"mwDw\" data-mw=\"{&quot;name&quot;:&quot;pre&quot;,&quot;attrs&quot;:{},&quot;body&quot;:{&quot;extsrc&quot;:&quot;\\n 1\\n 00:00:03,036 --&gt; 00:00:08,201\\n Pewnego dnia, w domu przeciętnego\\n studenta pojawiły się trzy boginie.\\n\\n 2\\n 00:00:08,708 --&gt; 00:00:13,168\\n Wszystkie używają różnych mocy,\\n by uczynić ludzi szczęśliwymi.\\n&quot;}}\"> 1\n 00:00:03,036 --&gt; 00:00:08,201\n Pewnego dnia, w domu przeciętnego\n studenta pojawiły się trzy boginie.\n\n 2\n 00:00:08,708 --&gt; 00:00:13,168\n Wszystkie używają różnych mocy,\n by uczynić ludzi szczęśliwymi.\u003c/pre>"}]}]}</script><script>(() => {
  const data = JSON.parse(document.getElementById('help-data').textContent);
  const tree = document.getElementById('helpTree');
  const topicHost = document.getElementById('topicHost');
  const search = document.getElementById('helpSearch');
  const clear = document.getElementById('clearSearch');
  const status = document.getElementById('searchStatus');
  const contentPane = document.getElementById('contentPane');
  const emptyState = document.getElementById('emptyState');
  const splitter = document.getElementById('splitter');

  function esc(value) {
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function normalizeText(value) {
    return (value || '')
      .toLocaleLowerCase('pl-PL')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'');
  }

  function stripHtml(value) {
    const div = document.createElement('div');
    div.innerHTML = value || '';
    return div.textContent || div.innerText || '';
  }

  function render() {
    tree.innerHTML = '';
    topicHost.innerHTML = '';

    data.categories.forEach((category, index) => {
      const details = document.createElement('details');
      details.className = 'tree-group';
      if (index === 0) details.open = true;
      details.dataset.categoryId = category.id;

      const summary = document.createElement('summary');
      summary.innerHTML = '<span class="tree-marker" aria-hidden="true"></span><span></span>';
      summary.lastElementChild.textContent = category.title;
      details.appendChild(summary);

      const items = document.createElement('div');
      items.className = 'tree-items';

      category.topics.forEach(topic => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'topic-link';
        button.dataset.target = topic.id;
        button.dataset.search = normalizeText(category.title + ' ' + topic.title + ' ' + stripHtml(topic.content));
        button.textContent = topic.title;
        items.appendChild(button);

        const article = document.createElement('article');
        article.className = 'help-topic';
        article.id = topic.id;
        article.innerHTML =
          '<header class="topic-header"><h1>' + esc(topic.title) + '</h1></header>' +
          '<div class="topic-content">' + (topic.content || '') + '</div>';
        topicHost.appendChild(article);
      });

      details.appendChild(items);
      tree.appendChild(details);
    });

    const first = data.categories.flatMap(c => c.topics)[0];
    if (first) showTopic(location.hash ? location.hash.slice(1) : first.id, false);
  }

  function allLinks() {
    return Array.from(document.querySelectorAll('.topic-link'));
  }

  function allTopics() {
    return Array.from(document.querySelectorAll('.help-topic'));
  }

  function showTopic(id, updateHash = true) {
    const topic = document.getElementById(id);
    if (!topic || !topic.classList.contains('help-topic')) return;

    allTopics().forEach(t => t.classList.toggle('active', t === topic));
    allLinks().forEach(l => l.classList.toggle('active', l.dataset.target === id));

    const activeLink = allLinks().find(l => l.dataset.target === id);
    if (activeLink) {
      const group = activeLink.closest('.tree-group');
      if (group) group.open = true;
      activeLink.scrollIntoView({block:'nearest'});
    }

    emptyState.classList.remove('visible');
    contentPane.scrollTop = 0;
    if (updateHash) history.replaceState(null,'','#' + id);
  }

  tree.addEventListener('click', event => {
    const link = event.target.closest('.topic-link');
    if (link) showTopic(link.dataset.target);
  });

  function applySearch() {
    const q = normalizeText(search.value.trim());
    const links = allLinks();
    let matches = 0;

    links.forEach(link => {
      const visible = !q || link.dataset.search.includes(q);
      link.classList.toggle('search-hidden', !visible);
      if (visible) matches++;
    });

    document.querySelectorAll('.tree-group').forEach(group => {
      const count = group.querySelectorAll('.topic-link:not(.search-hidden)').length;
      group.classList.toggle('search-hidden', count === 0);
      if (q && count > 0) group.open = true;
    });

    if (!q) {
      status.textContent = 'Wyszukiwanie obejmuje tytuły i treść tematów.';
      emptyState.classList.remove('visible');
    } else {
      status.textContent = matches === 1 ? 'Znaleziono 1 temat.' : 'Znaleziono ' + matches + ' tematów.';
      emptyState.classList.toggle('visible', matches === 0);
    }
  }

  search.addEventListener('input', applySearch);
  search.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      const first = allLinks().find(l => !l.classList.contains('search-hidden'));
      if (first) showTopic(first.dataset.target);
    } else if (event.key === 'Escape') {
      search.value = '';
      applySearch();
      search.focus();
    }
  });

  clear.addEventListener('click', () => {
    search.value = '';
    applySearch();
    search.focus();
  });

  contentPane.addEventListener('click', event => {
    const anchor = event.target.closest('a[href^="#"]');
    if (!anchor) return;
    const id = anchor.getAttribute('href').slice(1);
    const target = document.getElementById(id);
    if (target?.classList.contains('help-topic')) {
      event.preventDefault();
      showTopic(id);
    }
  });

  const DEFAULT_SIDEBAR_WIDTH = 360;
  const MIN_SIDEBAR_WIDTH = 240;
  const MAX_SIDEBAR_WIDTH = 700;

  function clampSidebarWidth(width) {
    const viewportLimit = Math.max(MIN_SIDEBAR_WIDTH, window.innerWidth - 320);
    return Math.max(MIN_SIDEBAR_WIDTH, Math.min(MAX_SIDEBAR_WIDTH, viewportLimit, width));
  }

  function setSidebarWidth(width) {
    const finalWidth = clampSidebarWidth(width);
    document.documentElement.style.setProperty('--sidebar', finalWidth + 'px');
    return finalWidth;
  }

  if (splitter) {
    let dragging = false;
    splitter.addEventListener('pointerdown', event => {
      if (window.innerWidth <= 620) return;
      dragging = true;
      splitter.classList.add('dragging');
      document.body.classList.add('resizing');
      splitter.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    splitter.addEventListener('pointermove', event => {
      if (dragging) setSidebarWidth(event.clientX);
    });
    function endResize(event) {
      if (!dragging) return;
      dragging = false;
      splitter.classList.remove('dragging');
      document.body.classList.remove('resizing');
      if (event?.pointerId !== undefined && splitter.hasPointerCapture(event.pointerId)) {
        splitter.releasePointerCapture(event.pointerId);
      }
    }
    splitter.addEventListener('pointerup', endResize);
    splitter.addEventListener('pointercancel', endResize);
    splitter.addEventListener('dblclick', () => setSidebarWidth(DEFAULT_SIDEBAR_WIDTH));
  }

  render();
})();</script></body></html>
